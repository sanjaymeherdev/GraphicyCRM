<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Registration — CRM Backend</title>
<style>
  :root{
    --ink:#0f1720;
    --ink-2:#161f2b;
    --paper:#eef1f4;
    --amber:#e0a458;
    --amber-dim:#8a6a3f;
    --line:rgba(238,241,244,0.12);
    --text-dim:rgba(238,241,244,0.56);
    --err:#e0765a;
    --ok:#7fb88f;
    --font-display: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --font-mono: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(224,164,88,0.08), transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:var(--font-mono);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:32px;
  }
  .card{ width:100%; max-width:380px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .brand-mark{ width:10px; height:10px; border-radius:2px; background:var(--amber); transform:rotate(45deg); }
  .brand-name{ font-family:var(--font-display); font-size:15px; letter-spacing:0.02em; color:var(--paper); }

  .admin-badge{
    display:inline-flex; align-items:center; gap:6px; background:rgba(224,164,88,0.10); color:var(--amber);
    border:1px solid rgba(224,164,88,0.25); border-radius:999px; padding:5px 11px;
    font-size:10.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:20px;
  }

  h1{ font-family:var(--font-display); font-weight:400; font-size:26px; margin:0 0 6px; color:var(--paper); }
  .sub{ color:var(--text-dim); font-size:13px; margin:0 0 28px; line-height:1.6; }

  form{ display:flex; flex-direction:column; gap:16px; }
  label{ display:block; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:7px; }
  input{
    width:100%; background:var(--ink-2); border:1px solid var(--line); border-radius:6px;
    padding:11px 12px; color:var(--paper); font-family:var(--font-mono); font-size:14px; outline:none;
    transition:border-color 0.15s ease;
  }
  input:focus{ border-color:var(--amber-dim); }
  input::placeholder{ color:rgba(238,241,244,0.28); }
  #adminSecret{ border-color:rgba(224,164,88,0.3); }

  button{
    margin-top:8px; background:var(--amber); color:#1c130a; border:none; border-radius:6px;
    padding:12px 16px; font-family:var(--font-mono); font-size:13px; font-weight:600; letter-spacing:0.03em;
    cursor:pointer; transition:filter 0.15s ease, transform 0.1s ease;
  }
  button:hover{ filter:brightness(1.08); }
  button:active{ transform:translateY(1px); }
  button:disabled{ opacity:0.55; cursor:default; }

  .msg{ font-size:12.5px; margin-top:2px; min-height:16px; }
  .msg.error{ color:var(--err); }
  .msg.ok{ color:var(--ok); }

  .toggle-row{ margin-top:22px; font-size:12.5px; color:var(--text-dim); text-align:center; }
  .toggle-row a{ color:var(--amber); text-decoration:none; }
  .toggle-row a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">CRM Backend</span></div>
    <div class="admin-badge">⚠ Admin access only</div>
    <h1>Create user account</h1>
    <p class="sub">Provisions a new login for the CRM. Requires the <code>ADMIN_SECRET</code> set on this deployment — anyone without it gets a 403, there's no public self-signup.</p>

    <form id="authForm">
      <div>
        <label for="adminSecret">Admin secret</label>
        <input id="adminSecret" type="password" autocomplete="off" placeholder="••••••••" required />
      </div>
      <div>
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Ada Lovelace" />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="user@company.com" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submitBtn">Create account →</button>
      <p class="msg" id="msg"></p>
    </form>

    <p class="toggle-row">← <a href="/login.html">Back to login</a></p>
  </div>

<script>
  const form = document.getElementById('authForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'msg';

    const adminSecret = document.getElementById('adminSecret').value.trim();
    const full_name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating…';
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-secret': adminSecret },
        body: JSON.stringify({ email, password, full_name }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to create user');

      msg.textContent = `✅ ${email} can now sign in.`;
      msg.className = 'msg ok';
      form.reset();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account →';
    }
  });
</script>
</body>
</html>

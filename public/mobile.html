<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GraphicyCRM · WhatsApp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== LIGHT THEME (default) ===== */
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f0f2f5;
      --surface3: #e4e6eb;
      --border: #e0e2e5;
      --border2: #c8cacc;
      --text: #1a1a2e;
      --text2: #4a4a6a;
      --text3: #8a8aaa;
      --green: #25d366;
      --green-dim: rgba(37, 211, 102, 0.15);
      --red: #f04f6e;
      --purple: #9d78fa;
      --blue: #4a8af4;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ===== DARK THEME ===== */
    [data-theme="dark"] {
      --bg: #0b0f15;
      --surface: #141a24;
      --surface2: #1c2535;
      --surface3: #263042;
      --border: #2a364a;
      --border2: #3a4a62;
      --text: #eaf0fa;
      --text2: #8ba0c0;
      --text3: #5a6f8a;
      --green: #25d366;
      --green-dim: rgba(37, 211, 102, 0.12);
      --red: #f04f6e;
      --purple: #9d78fa;
      --blue: #4a8af4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0f15; --surface: #141a24; --surface2: #1c2535; --surface3: #263042;
        --border: #2a364a; --border2: #3a4a62; --text: #eaf0fa; --text2: #8ba0c0; --text3: #5a6f8a;
      }
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    #app {
      display: flex; flex-direction: column; height: 100%;
      max-width: 480px; margin: 0 auto; background: var(--bg);
      position: relative; box-shadow: 0 0 60px rgba(0,0,0,0.6);
    }

    /* ---------- HEADER ---------- */
    .app-header {
      padding: calc(var(--safe-top) + 8px) 16px 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; transition: background 0.3s ease, border-color 0.3s ease;
    }
    .app-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
    .app-header h1 span { color: var(--green); }
    .header-actions { display: flex; gap: 4px; align-items: center; }
    #refreshBtn.spinning { animation: spin 0.8s linear infinite; pointer-events: none; opacity: 0.6; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .icon-btn { background: none; border: none; color: var(--text2); padding: 6px 8px; border-radius: 10px; cursor: pointer; font-size: 18px; transition: background 0.15s, color 0.3s; }
    .icon-btn:active { background: var(--surface2); }
    .theme-toggle { font-size: 16px; padding: 4px 6px; }

    /* ---------- SEARCH ---------- */
    .search-wrap { padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; display: none; gap: 10px; align-items: center; transition: background 0.3s ease, border-color 0.3s ease; }
    .search-box { flex: 1; display: flex; align-items: center; background: var(--surface2); border-radius: 24px; padding: 6px 14px; gap: 8px; border: 1px solid transparent; transition: border 0.2s, background 0.3s ease; }
    .search-box:focus-within { border-color: var(--green); }
    .search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 14px; flex: 1; padding: 8px 0; font-family: 'Inter', sans-serif; }
    .search-box input::placeholder { color: var(--text3); }
    .search-box .icon { color: var(--text3); font-size: 16px; }

    /* ---------- CHAT LIST ---------- */
    .chat-list { flex: 1; overflow-y: auto; padding: 4px 0; background: var(--bg); transition: background 0.3s ease; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.12s, border-color 0.3s ease; }
    .chat-item:active { background: var(--surface2); }
    .chat-item .avatar { width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; color: #fff; background: var(--surface3); overflow: hidden; }
    .chat-item .info { flex: 1; min-width: 0; }
    .chat-item .info .name { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
    .chat-item .info .name .time { font-weight: 400; font-size: 11px; color: var(--text3); }
    .chat-item .info .name .time.unread { color: var(--green); font-weight: 600; }
    .chat-item .info .preview { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; }
    .chat-item .unread-badge { background: var(--green); color: #000; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

    /* ---------- THREAD OVERLAY ---------- */
    #threadOverlay { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: none; flex-direction: column; animation: slideUp 0.25s ease; transition: background 0.3s ease; }
    #threadOverlay.open { display: flex; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .thread-header { padding: calc(var(--safe-top) + 6px) 10px 10px 6px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .thread-header .back-btn { background: none; border: none; color: var(--text); font-size: 22px; padding: 4px 8px; cursor: pointer; }
    .thread-header .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #fff; background: var(--surface3); overflow: hidden; }
    .thread-header .tinfo { flex: 1; min-width: 0; }
    .thread-header .tinfo .name { font-weight: 600; font-size: 15px; }
    .thread-header .tinfo .status { font-size: 11px; color: var(--text3); }

    /* ---------- MESSAGE AREA ---------- */
    .msg-area { flex: 1; overflow-y: auto; padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 2px; background: var(--bg); }
    .day-chip { align-self: center; background: var(--surface2); color: var(--text2); font-size: 11px; padding: 4px 14px; border-radius: 12px; margin: 6px 0; }
    .bubble-row { display: flex; }
    .bubble-row.out { justify-content: flex-end; }
    .bubble { max-width: 80%; padding: 7px 11px 8px; border-radius: 12px; font-size: 14px; line-height: 1.4; margin: 2px 6px; word-wrap: break-word; position: relative; }
    .bubble.in { background: var(--surface2); border-bottom-left-radius: 3px; }
    .bubble.out { background: var(--green-dim); border-bottom-right-radius: 3px; }
    .bubble .meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 4px; font-size: 10px; color: var(--text3); }
    .bubble .meta .tick.read { color: var(--blue); }
    .bubble .meta .tick.failed { color: var(--red); }

    /* ---------- COMPOSER ---------- */
    .composer { display: flex; align-items: flex-end; gap: 6px; padding: 6px 8px calc(8px + var(--safe-bottom)); background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    .composer .pill { flex: 1; background: var(--surface2); border-radius: 22px; display: flex; align-items: center; padding: 4px 6px 4px 14px; gap: 4px; min-height: 40px; border: 1px solid transparent; transition: border 0.2s; }
    .composer .pill:focus-within { border-color: var(--green); }
    .composer .pill textarea { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; resize: none; padding: 6px 0; max-height: 80px; min-height: 22px; }
    .composer .pill .action-btn { background: none; border: none; color: var(--text3); font-size: 18px; padding: 4px 6px; cursor: pointer; }
    .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--green); border: none; color: #000; font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s; }
    .send-btn:active { opacity: 0.7; }
    .send-btn:disabled { opacity: 0.3; cursor: default; }

    /* ---------- REPLY MODE TOGGLE ---------- */
    .reply-mode-toggle { display: flex; gap: 4px; padding: 6px 10px 2px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    .reply-mode-toggle .mode-btn { background: none; border: 1px solid var(--border2); border-radius: 16px; padding: 4px 12px; font-size: 11px; font-weight: 600; color: var(--text3); cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s; }
    .reply-mode-toggle .mode-btn.active { border-color: var(--green); background: var(--green-dim); color: var(--green); }

    /* ---------- TEMPLATE POPUP ---------- */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); cursor: pointer; }
    .modal-overlay.open { display: flex; }
    .modal-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-height: 85%; padding: 12px 16px calc(16px + var(--safe-bottom)); display: flex; flex-direction: column; overflow-y: auto; cursor: default; }
    .modal-sheet .handle { width: 40px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 12px; }
    .modal-sheet .title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
    .modal-sheet .sub { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
    .modal-sheet .tpl-preview { background: var(--surface2); border-radius: 12px; padding: 12px; margin-bottom: 14px; border-left: 3px solid var(--green); font-size: 13px; line-height: 1.5; max-height: 120px; overflow-y: auto; white-space: pre-wrap; }
    .modal-sheet .placeholder-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .modal-sheet .placeholder-row .tag { font-family: monospace; font-size: 12px; font-weight: 600; color: var(--purple); background: var(--surface3); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    .modal-sheet .placeholder-row input { flex: 1; background: var(--bg); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; }
    .modal-sheet .placeholder-row input:focus { border-color: var(--green); }
    .modal-sheet .modal-actions { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
    .modal-sheet .modal-actions button { padding: 8px 20px; border-radius: 12px; font-weight: 600; font-size: 13px; border: none; cursor: pointer; font-family: 'Inter', sans-serif; }
    .modal-sheet .modal-actions .cancel { background: var(--surface2); color: var(--text2); }
    .modal-sheet .modal-actions .send { background: var(--green); color: #000; }
    .modal-sheet .empty-tpl { padding: 20px; text-align: center; color: var(--text3); font-size: 13px; }

    /* ---------- TOAST ---------- */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface3); color: var(--text); padding: 10px 18px; border-radius: 24px; font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <h1>Graphicy<span>CRM</span> · WA</h1>
    <div class="header-actions">
      <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>
      <button class="icon-btn" title="Search" onclick="toggleSearch()">🔍</button>
      <button class="icon-btn" id="refreshBtn" title="Refresh" onclick="manualRefresh()">🔄</button>
    </div>
  </header>

  <!-- ===== SEARCH ===== -->
  <div class="search-wrap" id="searchWrap">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="searchInput" type="text" placeholder="Search messages or contacts..." oninput="filterChats(this.value)" />
      <button class="icon-btn" style="font-size:14px;padding:2px 4px;" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;">

    <div class="chat-list" id="chatList"></div>

    <!-- ===== THREAD OVERLAY ===== -->
    <div id="threadOverlay">
      <div class="thread-header">
        <button class="back-btn" onclick="closeThread()">‹</button>
        <div class="avatar" id="threadAvatar">👤</div>
        <div class="tinfo">
          <div class="name" id="threadName">Contact</div>
          <div class="status" id="threadStatus">via WhatsApp</div>
        </div>
      </div>
      <div class="msg-area" id="msgArea"></div>
      <div class="reply-mode-toggle" id="replyModeToggle">
        <button class="mode-btn active" data-mode="text" onclick="setReplyMode('text')">💬 Text</button>
        <button class="mode-btn" id="templateModeBtn" data-mode="template" onclick="setReplyMode('template')">📝 Template</button>
      </div>
      <div class="composer" id="composerArea">
        <div class="pill">
          <textarea id="composerInput" rows="1" placeholder="Type a message..." oninput="autoResize(this)"></textarea>
          <button class="action-btn" onclick="openTemplateModal()" id="tplQuickBtn" title="Template">📋</button>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendReply()">➤</button>
      </div>
    </div>

    <!-- ===== TEMPLATE MODAL ===== -->
    <div class="modal-overlay" id="templateModal" onclick="closeTemplateModalOnOverlay(event)">
      <div class="modal-sheet" id="templateModalSheet">
        <div class="handle"></div>
        <div class="title">📋 Select Template</div>
        <div class="sub" id="tplModalSub">Choose an approved template and fill in the placeholders.</div>
        <div id="tplModalBody">
          <div class="empty-tpl">Loading templates...</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ====================================================================
//  AUTH — reuses GraphicyCRM's existing login (js/api.js's crm_auth_token
//  in localStorage + the session cookie set by /api/auth/login). No
//  separate Supabase refresh-token dance needed here: same-origin fetch
//  calls are authenticated by the cookie, and the bearer token is sent
//  as a fallback exactly like the desktop dashboard already does.
// ====================================================================
const TOKEN_KEY = 'crm_auth_token';

function getToken() { return localStorage.getItem(TOKEN_KEY); }

async function apiCall(endpoint, method = 'GET', body = null) {
  const headers = { 'Content-Type': 'application/json' };
  const token = getToken();
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const options = { method, headers, credentials: 'include' };
  if (body) options.body = JSON.stringify(body);
  try {
    const res = await fetch(endpoint, options);
    if (res.status === 401) {
      window.location.href = '/login.html?return_to=/mobile.html';
      throw new Error('Session expired');
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    return { success: true, ...data };
  } catch (err) {
    console.error(`API Error [${endpoint}]:`, err);
    return { success: false, error: err.message };
  }
}

if (!getToken()) {
  window.location.href = '/login.html?return_to=/mobile.html';
}

// ====================================================================
//  STATE
// ====================================================================
const state = {
  threads: [],       // [{ id, name, phone, channel, last_message, last_message_at, needs_reply, messages: [...] }]
  searchQuery: '',
  currentId: null,
  templates: [],      // approved WhatsApp templates only
  replyMode: 'text',
};

// ====================================================================
//  THEME
// ====================================================================
function getPreferredTheme() {
  return localStorage.getItem('mobile_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('mobile_theme', theme);
}
function toggleTheme() {
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}
applyTheme(getPreferredTheme());

// ====================================================================
//  HELPERS
// ====================================================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function previewText(text) {
  return escapeHtml(String(text == null ? '' : text).replace(/\s+/g, ' ').trim());
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const diff = (now - d) / 60000;
  if (diff < 60) return `${Math.floor(diff)}m`;
  if (diff < 1440) return `${Math.floor(diff / 60)}h`;
  return d.toLocaleDateString([], { day: '2-digit', month: 'short' });
}
function initials(name) {
  return escapeHtml((name || '?').charAt(0).toUpperCase());
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._hide);
  el._hide = setTimeout(() => el.classList.remove('show'), 2500);
}

// ====================================================================
//  CHAT LIST
// ====================================================================
function renderChatList() {
  const container = document.getElementById('chatList');
  const query = state.searchQuery.toLowerCase().trim();
  let filtered = state.threads;

  if (query) {
    filtered = filtered.filter(t => {
      const nameMatch = (t.name || '').toLowerCase().includes(query) || (t.phone || '').includes(query);
      const msgMatch = (t.messages || []).some(m => (m.body || '').toLowerCase().includes(query));
      return nameMatch || msgMatch;
    });
  }

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>${query ? 'No matches found' : 'No WhatsApp conversations yet'}</p></div>`;
    return;
  }

  container.innerHTML = filtered.map(t => {
    const unread = unreadCount(t);
    return `
      <div class="chat-item" onclick="openThread('${t.id}')">
        <div class="avatar">${initials(t.name || t.phone)}</div>
        <div class="info">
          <div class="name">
            ${escapeHtml(t.name || t.phone || 'Unnamed')}
            <span class="time ${unread ? 'unread' : ''}">${formatTime(t.last_message_at)}</span>
          </div>
          <div class="preview">
            <span>${previewText(t.last_message) || 'No messages'}</span>
            ${unread ? `<span class="unread-badge">${unread}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function unreadCount(t) {
  return (t.messages || []).filter(m => m.direction === 'in' && !m.is_read).length;
}

function filterChats(query) {
  state.searchQuery = query;
  renderChatList();
}
function toggleSearch() {
  const wrap = document.getElementById('searchWrap');
  wrap.style.display = wrap.style.display === 'none' || !wrap.style.display ? 'flex' : 'none';
  if (wrap.style.display === 'flex') document.getElementById('searchInput').focus();
}
function clearSearch() {
  document.getElementById('searchInput').value = '';
  state.searchQuery = '';
  renderChatList();
}

// ====================================================================
//  THREAD
// ====================================================================
async function openThread(id) {
  state.currentId = id;
  const t = state.threads.find(x => x.id === id);
  if (!t) return;

  document.getElementById('threadOverlay').classList.add('open');
  renderThread(t);

  // Server only exposes mark-ALL-read (no per-conversation endpoint), same
  // limitation as the source app — still keeps unread state roughly in sync.
  if (unreadCount(t) > 0) {
    await apiCall('/api/whatsapp/messages/mark-read', 'POST');
  }

  // Pull the freshest messages for this thread specifically.
  const res = await apiCall(`/api/leads/${id}/messages?channel=whatsapp`);
  if (res.success) {
    t.messages = (res.messages || []).map(m => ({ ...m, is_read: true }));
    renderThread(t);
    renderChatList();
  }
}

function closeThread() {
  document.getElementById('threadOverlay').classList.remove('open');
  state.currentId = null;
  renderChatList();
}

function renderThread(t) {
  document.getElementById('threadAvatar').textContent = initials(t.name || t.phone);
  document.getElementById('threadName').textContent = t.name || t.phone || 'Unnamed';
  const last = (t.messages || [])[t.messages.length - 1];
  document.getElementById('threadStatus').textContent = last ? 'Last message: ' + formatTime(last.created_at) : (t.phone || 'via WhatsApp');

  const area = document.getElementById('msgArea');
  let lastDay = null, html = '';
  const sorted = [...(t.messages || [])].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  for (const m of sorted) {
    const d = new Date(m.created_at);
    const dayKey = d.toDateString();
    if (dayKey !== lastDay) {
      html += `<div class="day-chip">${d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' })}</div>`;
      lastDay = dayKey;
    }
    let tick = '';
    if (m.direction === 'out') tick = m.status === 'failed' ? `<span class="tick failed">✕ failed</span>` : `<span class="tick read">✓✓</span>`;
    html += `<div class="bubble-row ${m.direction === 'out' ? 'out' : 'in'}">
      <div class="bubble ${m.direction === 'out' ? 'out' : 'in'}">
        ${escapeHtml(m.body).replace(/\n/g, '<br>')}
        <div class="meta"><span>${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span> ${tick}</div>
      </div>
    </div>`;
  }
  area.innerHTML = html || `<div class="empty-state"><div class="icon">💬</div><p>No messages yet</p></div>`;
  area.scrollTop = area.scrollHeight;

  updateReplyModeUI(t);
}

// 22h window mirrors the server's own REPLY_WINDOW_HOURS check in
// modules/whatsapp/service.js — outside it, only an approved template
// can be sent (Meta's business-initiated messaging rule).
function updateReplyModeUI(t) {
  const lastInbound = [...(t.messages || [])].reverse().find(m => m.direction === 'in');
  const withinWindow = lastInbound && (Date.now() - new Date(lastInbound.created_at).getTime()) < 22 * 3600 * 1000;

  const textBtn = document.querySelector('.mode-btn[data-mode="text"]');
  const tplBtn = document.getElementById('templateModeBtn');
  const tplQuickBtn = document.getElementById('tplQuickBtn');

  if (withinWindow) {
    textBtn.style.display = '';
    tplBtn.style.display = 'none';
    tplQuickBtn.style.display = '';
    if (state.replyMode === 'template') setReplyMode('text');
  } else {
    textBtn.style.display = 'none';
    tplBtn.style.display = '';
    tplQuickBtn.style.display = 'none';
    setReplyMode('template');
  }
}

function setReplyMode(mode) {
  state.replyMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  const input = document.getElementById('composerInput');
  const tplQuickBtn = document.getElementById('tplQuickBtn');

  if (mode === 'template') {
    input.placeholder = 'Template mode — click 📋 to select';
    input.disabled = true;
    tplQuickBtn.style.display = '';
    document.getElementById('sendBtn').disabled = true;
  } else {
    input.placeholder = 'Type a message...';
    input.disabled = false;
    tplQuickBtn.style.display = 'none';
    document.getElementById('sendBtn').disabled = false;
  }
}

// ====================================================================
//  SEND — text goes through POST /api/leads/:id/messages (same endpoint
//  the desktop Inbox tab uses), which sends via Meta AND logs to
//  crm_messages in one call.
// ====================================================================
async function sendReply() {
  const input = document.getElementById('composerInput');
  const body = input.value.trim();
  const t = state.threads.find(x => x.id === state.currentId);
  if (!body || !t) return;

  showToast('📤 Sending...');
  const res = await apiCall(`/api/leads/${t.id}/messages`, 'POST', { channel: 'whatsapp', body });
  if (res.success) {
    t.messages = t.messages || [];
    t.messages.push(res.message);
    t.last_message = body;
    t.last_message_at = res.message?.created_at || new Date().toISOString();
    renderThread(t);
    renderChatList();
    input.value = '';
    autoResize(input);
    showToast('✅ Message sent');
  } else {
    showToast('❌ Failed: ' + (res.error || 'unknown error'));
  }
}

// ====================================================================
//  TEMPLATE MODAL
// ====================================================================
function closeTemplateModalOnOverlay(event) {
  if (event.target === event.currentTarget) closeTemplateModal();
}
function closeTemplateModal() {
  document.getElementById('templateModal').classList.remove('open');
}

async function openTemplateModal() {
  const modal = document.getElementById('templateModal');
  const body = document.getElementById('tplModalBody');
  const sub = document.getElementById('tplModalSub');
  const t = state.threads.find(x => x.id === state.currentId);

  const lastInbound = t ? [...(t.messages || [])].reverse().find(m => m.direction === 'in') : null;
  const withinWindow = lastInbound && (Date.now() - new Date(lastInbound.created_at).getTime()) < 22 * 3600 * 1000;
  sub.textContent = withinWindow
    ? '💬 You\'re within the 22h window — you can also reply with plain text.'
    : '⏰ 22h window closed — choose an approved template below.';

  if (!state.templates.length) {
    body.innerHTML = `<div class="empty-tpl">No approved WhatsApp templates available.</div>`;
    modal.classList.add('open');
    return;
  }

  body.innerHTML = state.templates.map(tpl => `
    <div style="background:var(--surface2);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;" onclick="selectTemplate('${tpl.id}')">
      <div style="font-weight:600;font-size:14px;color:var(--green);">${escapeHtml(tpl.name)}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px;">${escapeHtml(tpl.body.substring(0, 80))}${tpl.body.length > 80 ? '…' : ''}</div>
    </div>
  `).join('');

  modal.classList.add('open');
}

function selectTemplate(templateId) {
  const tpl = state.templates.find(t => t.id === templateId);
  if (!tpl) return;

  const matches = tpl.body.match(/\{\{([^}]+)\}\}/g) || [];
  const placeholders = [...new Set(matches.map(m => m.match(/\{\{([^}]+)\}\}/)?.[1] || ''))].filter(Boolean);

  const body = document.getElementById('tplModalBody');
  const sub = document.getElementById('tplModalSub');

  let fieldsHtml = placeholders.map(p => `
    <div class="placeholder-row">
      <span class="tag">{{${escapeHtml(p)}}}</span>
      <input type="text" id="tplField_${p.replace(/[^a-zA-Z0-9_-]/g, '_')}" placeholder="Enter value for {{${escapeHtml(p)}}}..." />
    </div>
  `).join('');
  if (!placeholders.length) {
    fieldsHtml = '<div style="color:var(--text2);font-size:13px;margin-bottom:10px;">No placeholders to fill. Click send to use this template.</div>';
  }

  body.innerHTML = `
    <div class="tpl-preview">${escapeHtml(tpl.body).replace(/\{\{([^}]+)\}\}/g, (m, p) => `<span style="color:var(--purple);font-weight:600;">{{${escapeHtml(p)}}}</span>`)}</div>
    ${fieldsHtml}
    <div class="modal-actions">
      <button class="cancel" onclick="closeTemplateModal()">Cancel</button>
      <button class="send" onclick="sendTemplateMessage('${templateId}')">📤 Send</button>
    </div>
  `;
  sub.textContent = `📋 ${tpl.name}`;
}

// Sends via POST /api/whatsapp/messages/send-template — placeholders are
// filled positionally into a Meta-format BODY component (Meta templates
// take numbered/positional parameters regardless of how the placeholder
// is named locally).
async function sendTemplateMessage(templateId) {
  const t = state.threads.find(x => x.id === state.currentId);
  const tpl = state.templates.find(x => x.id === templateId);
  if (!t || !tpl) return;
  if (!t.phone) { showToast('❌ This lead has no phone number on file'); return; }

  const matches = tpl.body.match(/\{\{([^}]+)\}\}/g) || [];
  const placeholders = [...new Set(matches.map(m => m.match(/\{\{([^}]+)\}\}/)?.[1] || ''))].filter(Boolean);

  const values = {};
  let previewBody = tpl.body;
  for (const p of placeholders) {
    const input = document.getElementById(`tplField_${p.replace(/[^a-zA-Z0-9_-]/g, '_')}`);
    const v = (input?.value || '').trim() || `[${p}]`;
    values[p] = v;
    previewBody = previewBody.replaceAll(`{{${p}}}`, v);
  }

  const components = placeholders.length
    ? [{ type: 'BODY', parameters: placeholders.map(p => ({ type: 'text', text: values[p] })) }]
    : [];

  showToast('📤 Sending template...');
  closeTemplateModal();

  const res = await apiCall('/api/whatsapp/messages/send-template', 'POST', {
    to: t.phone, name: tpl.meta_template_name || tpl.name, language: tpl.language || 'en_US', components,
  });

  if (res.success) {
    // The server logs the outbound row itself; reload this thread so the
    // bubble list picks it up rather than guessing its shape locally.
    const refreshed = await apiCall(`/api/leads/${t.id}/messages?channel=whatsapp`);
    if (refreshed.success) t.messages = refreshed.messages || [];
    t.last_message = previewBody;
    t.last_message_at = new Date().toISOString();
    renderThread(t);
    renderChatList();
    showToast('✅ Template sent');
  } else {
    showToast('❌ Failed: ' + (res.error || 'unknown error'));
  }
}

// ====================================================================
//  DATA LOADING
// ====================================================================
async function loadChats() {
  const res = await apiCall('/api/inbox?channel=whatsapp');
  if (res.success) {
    const wasInThread = state.currentId;
    state.threads = (res.threads || []).map(t => ({ ...t, messages: t.messages || [] }));
    renderChatList();
    if (wasInThread) {
      const t = state.threads.find(x => x.id === wasInThread);
      if (t) renderThread(t);
    }
  }
}

async function loadTemplates() {
  const res = await apiCall('/api/templates');
  if (res.success) {
    state.templates = (res.templates || []).filter(t => t.type === 'whatsapp_template' && t.status === 'APPROVED');
  }
}

async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  if (btn.classList.contains('spinning')) return;
  btn.classList.add('spinning');
  try { await Promise.all([loadChats(), loadTemplates()]); }
  finally { btn.classList.remove('spinning'); }
}

// ====================================================================
//  INIT
// ====================================================================
async function init() {
  await Promise.all([loadChats(), loadTemplates()]);
  setReplyMode('text');
  setInterval(loadChats, 30000);
  console.log('✅ GraphicyCRM mobile WhatsApp inbox ready');
}

if (getToken()) init();

window.openThread = openThread;
window.closeThread = closeThread;
window.sendReply = sendReply;
window.setReplyMode = setReplyMode;
window.openTemplateModal = openTemplateModal;
window.closeTemplateModal = closeTemplateModal;
window.closeTemplateModalOnOverlay = closeTemplateModalOnOverlay;
window.selectTemplate = selectTemplate;
window.sendTemplateMessage = sendTemplateMessage;
window.toggleSearch = toggleSearch;
window.clearSearch = clearSearch;
window.filterChats = filterChats;
window.autoResize = autoResize;
window.manualRefresh = manualRefresh;
window.toggleTheme = toggleTheme;
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM Suite | Client Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <!-- TOP BAR -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
      <span class="logo"><span class="logo-icon">🎯</span> Lead<span>CRM</span></span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="badge-dot" id="notifDot"></span></button>
      <button class="icon-btn" id="themeToggle"><i class="fas fa-moon"></i></button>
      <div class="user-menu" id="userMenu">
        <button class="user-btn" id="userBtn">
          <span class="user-avatar" id="userAvatar">A</span>
          <span class="user-name" id="userName">User</span>
        </button>
        <div class="user-dropdown" id="userDropdown">
          <div class="user-dropdown-header">
            <span class="user-avatar-lg" id="userAvatarLg">A</span>
            <div><div class="user-dropdown-name" id="userDropdownName">User</div><div class="user-dropdown-email" id="userDropdownEmail">user@example.com</div></div>
          </div>
          <hr />
          <button class="dropdown-item" id="profileBtn"><i class="fas fa-user"></i> Profile</button>
          <button class="dropdown-item" id="settingsBtn"><i class="fas fa-sliders-h"></i> Settings</button>
          <hr />
          <button class="dropdown-item text-danger" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-logo">
        <span class="logo-icon">🎯</span>
        <span class="logo-name">Lead<span>CRM</span></span>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-label">Pipeline</div>
          <button class="nav-item active" data-tab="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>
          <button class="nav-item" data-tab="contacts"><i class="fas fa-address-book"></i> Contacts <span class="nav-count" id="navContactsCount">0</span></button>
          <button class="nav-item" data-tab="inbox"><i class="fas fa-inbox"></i> Inbox <span class="nav-count" id="navInboxCount">0</span></button>
          <button class="nav-item" data-tab="leads"><i class="fas fa-bullseye"></i> Leads <span class="nav-count" id="navLeadsCount">0</span></button>
        </div>
        <div class="nav-section">
          <div class="nav-section-label">Content</div>
          <button class="nav-item" data-tab="schedule"><i class="fas fa-calendar-days"></i> Schedule</button>
          <button class="nav-item" data-tab="insights"><i class="fas fa-chart-line"></i> Insights</button>
        </div>
        <div class="nav-section">
          <div class="nav-section-label">Automation</div>
          <button class="nav-item" data-tab="automation"><i class="fas fa-bolt"></i> Automation</button>
          <button class="nav-item" data-tab="chatbot"><i class="fas fa-robot"></i> Chatbot</button>
          <button class="nav-item" data-tab="templates"><i class="fas fa-copy"></i> Templates</button>
          <button class="nav-item" data-tab="integrations"><i class="fas fa-plug"></i> Integrations</button>
        </div>
        <div class="nav-section">
          <div class="nav-section-label">Settings</div>
          <button class="nav-item" data-tab="sources"><i class="fas fa-plug"></i> Sources</button>
          <button class="nav-item" data-tab="settings"><i class="fas fa-sliders-h"></i> Settings</button>
          <button class="nav-item" data-tab="profile"><i class="fas fa-user"></i> Profile</button>
          <button class="nav-item" data-tab="reports"><i class="fas fa-chart-bar"></i> Reports</button>
        </div>
      </div>
      <div class="sidebar-bottom">
        <div class="sidebar-client-info" id="sidebarClientInfo">
          <span class="client-badge" id="sidebarClientBadge">A</span>
          <div>
            <div class="sidebar-client-name" id="sidebarClientName">Acme Corp</div>
            <div class="sidebar-client-role" id="sidebarClientRole">Client</div>
          </div>
        </div>
        <button class="logout-btn" id="sidebarLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent">
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <!-- TAB PANELS -->
    <div class="tab-panel active" id="tab-dashboard"></div>
    <div class="tab-panel" id="tab-contacts"></div>
    <div class="tab-panel" id="tab-inbox"></div>
    <div class="tab-panel" id="tab-leads"></div>
    <div class="tab-panel" id="tab-sources"></div>
    <div class="tab-panel" id="tab-settings"></div>
    <div class="tab-panel" id="tab-profile"></div>
    <div class="tab-panel" id="tab-schedule"></div>
    <div class="tab-panel" id="tab-insights"></div>
    <div class="tab-panel" id="tab-automation"></div>
    <div class="tab-panel" id="tab-chatbot"></div>
    <div class="tab-panel" id="tab-templates"></div>
    <div class="tab-panel" id="tab-integrations"></div>
    <div class="tab-panel" id="tab-reports"></div>
  </main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL CONTAINER -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Modal</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      <button class="btn btn-primary" id="modalConfirm">Confirm</button>
    </div>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="js/utils/constants.js"></script>
<script src="js/utils/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/contacts.js"></script>
<script src="js/modules/inbox.js"></script>
<script src="js/modules/leads.js"></script>
<script src="js/modules/sources.js"></script>
<script src="js/modules/settings.js"></script>
<script src="js/modules/profile.js"></script>
<script src="js/modules/schedule.js"></script>
<script src="js/modules/insights.js"></script>
<script src="js/modules/automation.js"></script>
<script src="js/modules/chatbot.js"></script>
<script src="js/modules/templates.js"></script>
<script src="js/modules/integrations.js"></script>
<script src="js/modules/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
